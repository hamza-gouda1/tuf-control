[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asusius"
version = "0.2.1"
description = "Control core for ASUS TUF/ROG laptops on Linux"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Hamza Gouda" }]
dependencies = []

[project.optional-dependencies]
dbus = ["PyGObject"]
gui = ["PyGObject", "pycairo"]
qa = ["PyGObject", "pycairo", "Pillow"]
dev = ["pytest", "ruff"]

[project.scripts]
asusius = "asusius.cli:main"
asusiusd = "asusius.daemon:main"
asusius-mcp = "asusius.agent.mcp:main"

[project.gui-scripts]
asusius-gui = "asusius.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"asusius.ui" = ["*.css", "icons/hicolor/scalable/apps/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["hardware: read-only smoke test on real hardware (set ASUSIUS_HARDWARE_TESTS=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Real errors only for now: syntax errors, undefined names, invalid comparisons.
select = ["E9", "F63", "F7", "F82"]
