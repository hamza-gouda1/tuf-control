name: Release archives
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        default: v0.1.1
permissions:
  contents: write
jobs:
  archives:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build deterministic source archive and checksum
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 tools/release_archive.py --tag "$RELEASE_TAG" --out dist
      - name: Attach archive and checksum to the selected release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
