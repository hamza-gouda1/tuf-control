name: Release archives
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
permissions:
  contents: write
jobs:
  archives:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify release tag matches pyproject.toml version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - "$RELEASE_TAG" <<'PY'
          import sys, tomllib
          from pathlib import Path
          tag = sys.argv[1]
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match pyproject.toml version {version!r}")
          PY
      - name: Clean dist and build deterministic source archive and checksum
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          rm -rf dist
          python3 tools/release_archive.py --tag "$RELEASE_TAG" --out dist
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Attach archive and checksum to the selected release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
