name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: GTK and GLib bindings for the UI logic tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-apt python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 libglib2.0-bin gsettings-desktop-schemas
      - name: Unit tests (fake sysfs tree and fake D-Bus transport, no hardware)
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Ruff
        run: |
          python3 -m pip install --user ruff
          python3 -m ruff check src tests

  brand-palette:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Shared Bordeaux source tokens
        uses: actions/checkout@v7
        with:
          repository: hamza-gouda1/bordeaux-gnome
          ref: main
          path: brand-source
          persist-credentials: false
      - name: Shared generator and palette are current
        run: |
          cmp tools/sync_tuf_palette.py brand-source/tools/sync_tuf_palette.py
          python3 tools/sync_tuf_palette.py --source brand-source --target . --check

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck -S warning install.sh uninstall.sh tests/test_install.sh
      - name: Installer test (temporary HOME)
        run: bash tests/test_install.sh

  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install gjs
        run: sudo apt-get update && sudo apt-get install -y gjs
      - name: Syntax check
        run: |
          for f in extension/asusius-quick@hamza-gouda/*.js; do
            node --input-type=module --check < "$f"
          done
      - name: Extension logic tests
        run: |
          gjs -m tests/test_quick_profiles.js
          gjs -m tests/test_gestures.js
      - name: Validate settings schema
        run: glib-compile-schemas --strict --dry-run extension/asusius-quick@hamza-gouda/schemas
      - name: metadata.json
        run: python3 -c "import json; json.load(open('extension/asusius-quick@hamza-gouda/metadata.json'))"
