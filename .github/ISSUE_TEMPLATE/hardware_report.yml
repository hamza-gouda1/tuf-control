name: Hardware report
description: Tell us how Asusius behaves on your laptop model
labels: [hardware]
body:
  - type: input
    id: model
    attributes:
      label: Laptop model
    validations: {required: true}
  - type: textarea
    id: caps
    attributes:
      label: Output of `asusius capabilities --json`
      render: json
    validations: {required: true}
  - type: textarea
    id: notes
    attributes:
      label: What works, what does not
