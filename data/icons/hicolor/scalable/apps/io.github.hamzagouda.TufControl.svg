<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- TUF Control: wine tile, gold "TC" monogram (C as a fan arc, T as a stem) -->
  <defs>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A53A55"/>
      <stop offset="1" stop-color="#5A1729"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="30" y1="28" x2="96" y2="96">
      <stop offset="0" stop-color="#E6D2AE"/>
      <stop offset="1" stop-color="#B8976A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="8" y="12" width="112" height="108" rx="26" fill="#3A0E1A" opacity="0.35"/>
  <rect x="8" y="8" width="112" height="108" rx="26" fill="url(#wine)"/>
  <rect x="8" y="8" width="112" height="108" rx="26" fill="url(#sheen)"/>
  <rect x="9" y="9" width="110" height="106" rx="25" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
  <!-- C: a 270 degree arc, open to the right -->
  <path d="M 87.4 38.6 A 33 33 0 1 0 87.4 85.4" fill="none" stroke="url(#gold)"
        stroke-width="7" stroke-linecap="round"/>
  <!-- T: crossbar and stem inside the arc -->
  <path d="M 46 47 H 80" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 63 47 V 80" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
  <!-- fine hairline accent -->
  <circle cx="64" cy="62" r="42" fill="none" stroke="#C9AE86" stroke-opacity="0.22" stroke-width="1"/>
</svg>
